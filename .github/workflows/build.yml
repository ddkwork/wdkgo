name: Build HyperDbg Driver

on:
  push:
    branches:
      - master
      - dev
  pull_request:
    branches:
      - master
      - dev
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    permissions:
      contents: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v6

    - name: Setup Go
      uses: actions/setup-go@v6
      with:
        go-version: '1.26.1'

    - name: Clone HyperDbg repository
      run: |
        if (Test-Path HyperDbg) { Remove-Item -Recurse -Force HyperDbg }
        git clone --recursive -b dev https://github.com/HyperDbg/HyperDbg.git HyperDbg
      shell: pwsh

    - name: Verify Go source
      run: |
        go vet ./...
      shell: pwsh

    - name: Run translate test
      run: |
        go test -v -run TestTranslate -count=1 -timeout 300s .
      shell: pwsh

    - name: Clone ewdk repository
      run: |
        cd $env:GITHUB_WORKSPACE\..
        git clone https://github.com/ddkwork/ewdk.git

    - name: Install aria2 (via ewdk)
      working-directory: ..\ewdk
      run: |
        $ProgressPreference = 'SilentlyContinue'
        $aria2Url = "https://github.com/aria2/aria2/releases/download/release-1.37.0/aria2-1.37.0-win-64bit-build1.zip"
        Invoke-WebRequest -Uri $aria2Url -OutFile "$env:TEMP\aria2.zip" -UseBasicParsing
        Expand-Archive -Path "$env:TEMP\aria2.zip" -DestinationPath "$env:TEMP\aria2" -Force
        Get-ChildItem "$env:TEMP\aria2" -Filter "aria2c.exe" -Recurse | Move-Item -Destination "$env:TEMP\aria2c.exe" -Force

    - name: Cache EWDK ISO
      id: cache-iso
      uses: actions/cache@v5
      with:
        path: C:\Users\runneradmin\AppData\Local\Temp\ewdk.iso
        key: ewdk-iso-28000
        restore-keys: |
          ewdk-iso-

    - name: Download EWDK ISO (via ewdk)
      if: steps.cache-iso.outputs.cache-hit != 'true'
      working-directory: ..\ewdk
      run: |
        go run scripts/get_ewdk_url.go
        $ewdkUrl = Get-Content "$env:GITHUB_ENV" | Select-String "EWDK_ISO_URL=" | ForEach-Object { $_.ToString().Replace("EWDK_ISO_URL=", "").Trim() }
        Write-Host "Downloading EWDK ISO from: $ewdkUrl"
        & "$env:TEMP\aria2c.exe" -x16 -s16 --file-allocation=none -d "$env:TEMP" -o ewdk.iso $ewdkUrl
        $fileSize = (Get-Item "$env:TEMP\ewdk.iso").Length
        Write-Host "ISO downloaded: $([math]::Round($fileSize/1MB, 2)) MB"

    - name: Mount EWDK ISO and set registry environment (via ewdk main.go)
      working-directory: ..\ewdk
      run: go run .

    - name: Build driver
      shell: cmd
      run: |
        cd hyperdbg-driver\gen
        call d:\ewdk\BuildEnv\SetupBuildEnv.cmd
        cmake -B build -G "NMake Makefiles" -DCMAKE_BUILD_TYPE=Release .
        cmake --build build --config Release

    - name: Upload driver artifact
      uses: actions/upload-artifact@v4
      with:
        name: solod_hyperkd
        path: hyperdbg-driver/gen/build/*.sys
        if-no-files-found: warn

    - name: Get commit info
      id: info
      run: |
        $commit = git -C HyperDbg rev-parse HEAD
        $date = git -C HyperDbg log -1 --format=%cd --date=short
        echo "commit=$commit" >> $env:GITHUB_OUTPUT
        echo "date=$date" >> $env:GITHUB_OUTPUT
      shell: pwsh

    - name: Delete existing release
      uses: dev-drprasad/delete-older-releases@v0.3.4
      with:
        keep_latest: 0
        delete_tag_pattern: latest
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Create Release
      uses: softprops/action-gh-release@v3
      with:
        tag_name: latest
        name: HyperDbg Solod Driver - Latest
        files: |
          hyperdbg-driver/gen/build/*.sys
        body: |
          HyperDbg Solod-transpiled driver build

          Snapshot Date: ${{ steps.info.outputs.date }}
          HyperDbg Commit: ${{ steps.info.outputs.commit }}
          Repo Commit: ${{ github.sha }}
        draft: false
        prerelease: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
